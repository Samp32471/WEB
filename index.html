      "Write HTML + CSS for a gradient background (linear-gradient) on a <div> with a centered heading.",
      "Create a loading spinner animation using @keyframes and border rotation.",
      "Style a blockquote with a left border (4px solid #a855f7), italic text, and padding.",
      "Write HTML + CSS for a responsive image that scales with its container using max-width:100% and height:auto.",
      "Create a dropdown menu that appears on hover, using only CSS (no JS).",
      "Style list items with custom bullets using ::before (e.g., a checkmark or arrow).",
      "Create a footer with three equal columns using Flexbox, each column centered text on a dark background.",
    ];
    practicalQ.forEach(q => addQ("practical", "HTML+CSS", q));

    console.log('Total Front-End questions:', questions.length);

    // ---------- STATE ----------
    let currentUser = { fullname: '', course: '', admission: '' };
    let answers = new Array(questions.length).fill(null).map(() => ({ value: null, text: '' }));
    let timeLeft = 7200;
    let timerInterval = null;
    let examActive = false;
    let tabSwitchCount = 0;
    let fullscreenExitCount = 0;
    let antiCheatAttached = false; // prevent duplicate listeners

    const loginContainer = document.getElementById('loginContainer');
    const examContainer = document.getElementById('examContainer');
    const loginBtn = document.getElementById('loginBtn');
    const fullnameInput = document.getElementById('fullname');
    const courseInput = document.getElementById('course');
    const admissionInput = document.getElementById('admission');
    const studentInfo = document.getElementById('studentInfo');
    const timerDisplay = document.getElementById('timerDisplay');
    const questionsArea = document.getElementById('questionsArea');
    const progressStatus = document.getElementById('progressStatus');
    const submitExamBtn = document.getElementById('submitExamBtn');
    const overlay = document.getElementById('overlay');
    const overlayMessage = document.getElementById('overlayMessage');
    const returnBtn = document.getElementById('returnBtn');
    const antiCheatLog = document.getElementById('antiCheatLog');

    // ---------- RENDER ----------
    function renderQuestions() {
      let html = '';
      questions.forEach((q, idx) => {
        const num = idx + 1;
        let typeLabel = '';
        let pointsLabel = '';
        if (q.type === 'mcq') { typeLabel = 'Multiple Choice'; pointsLabel = POINTS.mcq + ' pt'; }
        else if (q.type === 'tf') { typeLabel = 'True / False'; pointsLabel = POINTS.tf + ' pt'; }
        else if (q.type === 'long') { typeLabel = 'Long Answer'; pointsLabel = POINTS.long + ' pts'; }
        else if (q.type === 'practical') { typeLabel = 'Practical (HTML + CSS)'; pointsLabel = POINTS.practical + ' pts'; }

        html += `<div class="question-card" data-qidx="${idx}">`;
        html += `<div class="question-title">`;
        html += `<span class="q-number">Q${num}</span>`;
        html += `<span class="q-type">${typeLabel}</span>`;
        html += `<span class="q-tag">${q.topic}</span>`;
        html += `<span class="q-points">${pointsLabel}</span>`;
        html += `</div>`;
        html += `<div style="margin-bottom:12px; font-weight:500;">${escapeHtml(q.text)}</div>`;

        if (q.type === 'mcq' && q.options) {
          html += `<div class="options">`;
          q.options.forEach((opt, oi) => {
            html += `<div class="option-item">`;
            html += `<input type="radio" name="q${num}_radio" value="${oi}" id="opt_${num}_${oi}" data-qidx="${idx}" data-optidx="${oi}" class="mcq-radio">`;
            html += `<label for="opt_${num}_${oi}">${escapeHtml(opt)}</label>`;
            html += `</div>`;
          });
          html += `</div>`;
        } else if (q.type === 'tf') {
          html += `<div class="truefalse">`;
          html += `<label><input type="radio" name="tf_${num}" value="true" data-qidx="${idx}" data-tf="0"> True</label>`;
          html += `<label><input type="radio" name="tf_${num}" value="false" data-qidx="${idx}" data-tf="1"> False</label>`;
          html += `</div>`;
        } else if (q.type === 'long') {
          html += `<textarea rows="5" placeholder="Your answer here..." data-qidx="${idx}" data-type="long" class="text-answer"></textarea>`;
        } else if (q.type === 'practical') {
          html += `<textarea class="code-editor" rows="12" placeholder="Write your complete HTML file here, including a <style> block for CSS..." data-qidx="${idx}" data-type="practical"></textarea>`;
        }
        html += `</div>`;
      });
      questionsArea.innerHTML = html;
      attachQuestionListeners();
      updateProgress();
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
      });
    }

    function attachQuestionListeners() {
      document.querySelectorAll('.mcq-radio').forEach(radio => {
        radio.addEventListener('change', (e) => {
          const qidx = parseInt(e.target.dataset.qidx);
          answers[qidx] = { value: parseInt(e.target.dataset.optidx), text: '' };
          updateProgress();
        });
      });
      document.querySelectorAll('input[data-tf]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          const qidx = parseInt(e.target.dataset.qidx);
          answers[qidx] = { value: parseInt(e.target.dataset.tf), text: '' };
          updateProgress();
        });
      });
      document.querySelectorAll('textarea[data-qidx]').forEach(ta => {
        ta.addEventListener('input', (e) => {
          const qidx = parseInt(e.target.dataset.qidx);
          answers[qidx] = { value: null, text: e.target.value };
          updateProgress();
        });
      });
    }

    function updateProgress() {
      let answered = 0;
      answers.forEach(ans => {
        if (ans.value !== null || (ans.text && ans.text.trim() !== '')) answered++;
      });
      progressStatus.innerText = `${answered} / ${questions.length} answered`;
    }

    // =====================================================
    // AUTO-GRADING (objective only — MCQ + TF = 110 questions)
    // =====================================================
    function autoGrade() {
      let score = 0;
      let totalObjective = 0;
      let attempted = 0;
      let unanswered = 0;

      let htmlMcqScore = 0, htmlMcqTotal = 0;
      let cssMcqScore = 0, cssMcqTotal = 0;
      let htmlTfScore = 0, htmlTfTotal = 0;
      let cssTfScore = 0, cssTfTotal = 0;

      questions.forEach((q, idx) => {
        if (q.type !== 'mcq' && q.type !== 'tf') return;
        if (q.correct === null || q.correct === undefined) return;

        totalObjective++;

        if (q.type === 'mcq' && q.topic === 'HTML') htmlMcqTotal++;
        if (q.type === 'mcq' && q.topic === 'CSS')  cssMcqTotal++;
        if (q.type === 'tf'  && q.topic === 'HTML') htmlTfTotal++;
        if (q.type === 'tf'  && q.topic === 'CSS')  cssTfTotal++;

        const studentAnswer = answers[idx] ? answers[idx].value : null;

        if (studentAnswer === null || studentAnswer === undefined) {
          unanswered++;
          return;
        }

        attempted++;

        if (studentAnswer === q.correct) {
          score++;
          if (q.type === 'mcq' && q.topic === 'HTML') htmlMcqScore++;
          if (q.type === 'mcq' && q.topic === 'CSS')  cssMcqScore++;
          if (q.type === 'tf'  && q.topic === 'HTML') htmlTfScore++;
          if (q.type === 'tf'  && q.topic === 'CSS')  cssTfScore++;
        }
      });

      const percentage = totalObjective > 0
        ? Math.round((score / totalObjective) * 100 * 100) / 100
        : 0;

      const htmlScore = htmlMcqScore + htmlTfScore;
      const htmlTotal = htmlMcqTotal + htmlTfTotal;
      const cssScore  = cssMcqScore  + cssTfScore;
      const cssTotal  = cssMcqTotal  + cssTfTotal;

      return {
        score,
        totalObjective,
        attempted,
        unanswered,
        percentage,
        htmlScore,
        htmlTotal,
        cssScore,
        cssTotal,
        htmlMcqScore, htmlMcqTotal,
        cssMcqScore,  cssMcqTotal,
        htmlTfScore,  htmlTfTotal,
        cssTfScore,   cssTfTotal
      };
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerDisplay.innerText = '00:00:00';
          forceSubmit('Time expired');
          return;
        }
        timeLeft--;
        const hrs = Math.floor(timeLeft / 3600);
        const mins = Math.floor((timeLeft % 3600) / 60);
        const secs = timeLeft % 60;
        timerDisplay.innerText = `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        if (timeLeft < 300) timerDisplay.classList.add('warning');
        else timerDisplay.classList.remove('warning');
      }, 1000);
    }

    function startAntiCheat() {
      if (antiCheatAttached) return; // prevent stacking listeners
      antiCheatAttached = true;

      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      document.addEventListener('visibilitychange', () => {
        if (!examActive) return;
        if (document.hidden) {
          tabSwitchCount++;
          antiCheatLog.classList.remove('hidden');
          antiCheatLog.innerText = `⚠️ Tab switch detected! (${tabSwitchCount})`;
          showOverlay('Tab switching is not allowed. Please stay on this tab.');
        }
      });
      document.addEventListener('fullscreenchange', () => {
        if (!examActive) return;
        if (!document.fullscreenElement) {
          fullscreenExitCount++;
          showOverlay('Fullscreen mode exited. Please return to fullscreen.');
        }
      });
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if (!examActive) return;
        const blocked = e.ctrlKey || e.metaKey;
        if (blocked && ['c','v','u','s','p'].includes(e.key.toLowerCase())) {
          e.preventDefault();
        }
      });
    }

    function showOverlay(msg) {
      overlayMessage.innerText = msg || 'Please return to full screen and stay on this tab.';
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
      if (examActive && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    returnBtn.addEventListener('click', () => {
      hideOverlay();
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });

    // =====================================================
    // SUBMIT — FIXED VERSION
    // =====================================================
    async function sendEmailAndSubmit(reason = 'manual') {
      if (!examActive) return;
      examActive = false;
      clearInterval(timerInterval);

      const grade = autoGrade();
      const timestamp = new Date().toLocaleString();

      let answerDetails = '';
      questions.forEach((q, idx) => {
        const ans = answers[idx] || { value: null, text: '' };
        let ansText = '';
        if (q.type === 'mcq' && ans.value !== null) {
          ansText = q.options[ans.value];
        } else if (q.type === 'tf' && ans.value !== null) {
          ansText = ans.value === 0 ? 'True' : 'False';
        } else if (ans.text && ans.text.trim()) {
          ansText = ans.text.length > 800 ? ans.text.substring(0, 800) + '...[truncated]' : ans.text;
        } else {
          ansText = '[no answer]';
        }
        answerDetails += `Q${idx+1} [${q.type.toUpperCase()} · ${q.topic} · ${POINTS[q.type]}pt]: ${q.text}\n   → ${ansText}\n\n`;
      });

      const templateParams = {
        student_name: currentUser.fullname,
        course: currentUser.course,
        admission_number: currentUser.admission,
        timestamp: timestamp,
        reason: reason,
        exam_type: "Front-End Exam (HTML + CSS)",

        score: grade.score,
        total_objective: grade.totalObjective,
        percentage: grade.percentage,
        attempted: grade.attempted,
        unanswered: grade.unanswered,

        html_score: `${grade.htmlScore}/${grade.htmlTotal}`,
        css_score:  `${grade.cssScore}/${grade.cssTotal}`,
        html_mcq:   `${grade.htmlMcqScore}/${grade.htmlMcqTotal}`,
        css_mcq:    `${grade.cssMcqScore}/${grade.cssMcqTotal}`,
        html_tf:    `${grade.htmlTfScore}/${grade.htmlTfTotal}`,
        css_tf:     `${grade.cssTfScore}/${grade.cssTfTotal}`,

        tab_switches: tabSwitchCount,
        fullscreen_exits: fullscreenExitCount,

        answer_details: answerDetails,
        to_email: "samp32471@gmail.com"
      };

      submitExamBtn.disabled = true;
      submitExamBtn.innerText = '⏳ Sending...';

      try {
        if (typeof emailjs === 'undefined') throw new Error('EmailJS not loaded');
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);

        alert(
          `✅ Front-End Exam submitted successfully!\n\n` +
          `━━━ OVERALL ━━━\n` +
          `Score:      ${grade.score} / ${grade.totalObjective}\n` +
          `Percentage: ${grade.percentage}%\n` +
          `Attempted:  ${grade.attempted} / ${grade.totalObjective}\n` +
          `Unanswered: ${grade.unanswered}\n\n` +
          `━━━ BY SECTION ━━━\n` +
          `HTML MCQ:   ${grade.htmlMcqScore}/${grade.htmlMcqTotal}\n` +
          `CSS MCQ:    ${grade.cssMcqScore}/${grade.cssMcqTotal}\n` +
          `HTML T/F:   ${grade.htmlTfScore}/${grade.htmlTfTotal}\n` +
          `CSS T/F:    ${grade.cssTfScore}/${grade.cssTfTotal}\n` +
          `HTML Total: ${grade.htmlScore}/${grade.htmlTotal}\n` +
          `CSS Total:  ${grade.cssScore}/${grade.cssTotal}\n\n` +
          `Your answers have been emailed.`
        );
      } catch (err) {
        console.error('EmailJS error:', err);
        alert(
          `⚠️ Email could not be sent (${err.text || err.message || 'unknown error'}).\n` +
          `Objective score: ${grade.score}/${grade.totalObjective} (${grade.percentage}%).\n` +
          `Please contact the examiner.`
        );
      }

      examContainer.classList.add('hidden');
      loginContainer.classList.remove('hidden');
      overlay.classList.add('hidden');
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      submitExamBtn.disabled = false;
      submitExamBtn.innerText = '📨 Submit & Email';
      antiCheatLog.classList.add('hidden');
    }

    function forceSubmit(reason) { if (examActive) sendEmailAndSubmit(reason); }

    submitExamBtn.addEventListener('click', () => {
      const answeredCount = answers.filter(a => a.value !== null || (a.text && a.text.trim())).length;
      if (confirm(`Submit Front-End exam now? You have answered ${answeredCount} / ${questions.length} questions.`)) {
        sendEmailAndSubmit('manual submit');
      }
    });

    // =====================================================
    // LOGIN — FIXED VERSION
    // =====================================================
    loginBtn.addEventListener('click', () => {
      const fullname = fullnameInput.value.trim();
      const course = courseInput.value.trim();
      const admission = admissionInput.value.trim();
      if (!fullname || !course || !admission) {
        alert('Please fill all fields.');
        return;
      }
      currentUser = { fullname, course, admission };
      loginContainer.classList.add('hidden');
      examContainer.classList.remove('hidden');
      studentInfo.innerText = `👤 ${fullname} · ${course} · ${admission}`;

      answers = new Array(questions.length).fill(null).map(() => ({ value: null, text: '' }));
      renderQuestions();

      timeLeft = 7200;
      timerDisplay.innerText = '02:00:00';
      timerDisplay.classList.remove('warning');
      if (timerInterval) clearInterval(timerInterval);

      examActive = true;
      tabSwitchCount = 0;
      fullscreenExitCount = 0;
      antiCheatLog.classList.add('hidden');

      startTimer();
      startAntiCheat();
    });

    // Allow Enter key in login fields to trigger login (better UX)
    [fullnameInput, courseInput, admissionInput].forEach(inp => {
      inp.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          loginBtn.click();
        }
      });
    });

    window.addEventListener('load', () => {
      loginContainer.classList.remove('hidden');
      examContainer.classList.add('hidden');
      overlay.classList.add('hidden');
    });

    window.addEventListener('beforeunload', (e) => {
      if (examActive) {
        e.preventDefault();
        e.returnValue = 'Front-End exam in progress. Are you sure?';
        return e.returnValue;
      }
    });

  })();
  </script>
</body>
