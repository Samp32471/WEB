<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Design Exam - 500 Questions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            padding: 30px 35px 45px;
        }
        #loginScreen { display: block; }
        #examScreen { display: none; }
        .login-title {
            font-size: 28px;
            font-weight: 700;
            color: #0a1e3c;
            margin-bottom: 8px;
        }
        .login-sub {
            color: #4a5b6e;
            margin-bottom: 28px;
            font-size: 15px;
        }
        .login-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 30px;
            background: #f8faff;
            padding: 28px 30px;
            border-radius: 20px;
            border: 1px solid #e6edf5;
        }
        .login-grid .full-width { grid-column: 1 / -1; }
        .login-grid label {
            font-weight: 600;
            font-size: 14px;
            color: #1a2b44;
            display: block;
            margin-bottom: 6px;
        }
        .login-grid input, .login-grid select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #d9e2ec;
            border-radius: 14px;
            font-size: 15px;
            background: white;
        }
        .login-grid input:focus, .login-grid select:focus {
            border-color: #2d6fee;
            outline: none;
            box-shadow: 0 0 0 4px rgba(45, 111, 238, 0.12);
        }
        .login-btn {
            grid-column: 1 / -1;
            background: #1a3c6e;
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .login-btn:hover {
            background: #0f2b50;
            transform: scale(1.01);
            box-shadow: 0 6px 20px rgba(26, 60, 110, 0.3);
        }
        .login-error {
            color: #c72a2a;
            font-size: 14px;
            margin-top: 12px;
            display: none;
            grid-column: 1 / -1;
            text-align: center;
            background: #ffe9e9;
            padding: 10px;
            border-radius: 12px;
        }
        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 20px;
            padding-bottom: 18px;
            border-bottom: 2px solid #eaf0f6;
            margin-bottom: 22px;
        }
        .exam-header h2 { font-size: 22px; color: #0a1e3c; }
        .exam-meta {
            display: flex;
            gap: 20px;
            font-size: 14px;
            background: #f0f6fe;
            padding: 8px 20px;
            border-radius: 40px;
            color: #1a3c6e;
        }
        .exam-meta span { font-weight: 600; }
        .timer-box {
            background: #0a1e3c;
            color: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 1px;
        }
        .progress-bar {
            background: #e9eef4;
            height: 8px;
            border-radius: 10px;
            margin: 14px 0 22px;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: #1a3c6e;
            border-radius: 10px;
            transition: width 0.3s;
        }
        .question-counter {
            font-size: 15px;
            font-weight: 600;
            color: #1a2b44;
            margin-bottom: 14px;
        }
        .question-card {
            background: #fafcff;
            border: 1px solid #e6edf5;
            border-radius: 20px;
            padding: 28px 30px;
            margin-bottom: 18px;
        }
        .question-card .q-text {
            font-size: 18px;
            font-weight: 600;
            color: #0a1e3c;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            background: white;
            border-radius: 14px;
            border: 1.5px solid #e2eaf2;
            cursor: pointer;
            transition: 0.15s;
            font-size: 15px;
        }
        .options label:hover {
            border-color: #8aabcf;
            background: #f5f9ff;
        }
        .options input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #1a3c6e;
            flex-shrink: 0;
        }
        .options label.selected {
            border-color: #1a3c6e;
            background: #eaf2fd;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .nav-buttons button {
            padding: 12px 32px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            background: #e9eef4;
            color: #1a2b44;
        }
        .nav-buttons button:hover:not(:disabled) { background: #d0dae6; }
        .nav-buttons button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .nav-buttons .primary {
            background: #1a3c6e;
            color: white;
        }
        .nav-buttons .primary:hover:not(:disabled) { background: #0f2b50; }
        .nav-buttons .submit-btn {
            background: #c72a2a;
            color: white;
            padding: 12px 40px;
        }
        .nav-buttons .submit-btn:hover:not(:disabled) { background: #a11f1f; }
        .loading {
            text-align: center;
            padding: 20px;
            color: #1a3c6e;
        }
        #submissionStatus {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            padding: 10px;
            border-radius: 12px;
            display: none;
        }
        #submissionStatus.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        #submissionStatus.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        #submissionStatus.loading {
            display: block;
            background: #cce5ff;
            color: #004085;
            border: 1px solid #b8daff;
        }
        @media (max-width: 700px) {
            .container { padding: 20px 15px; }
            .login-grid { grid-template-columns: 1fr; padding: 20px; }
            .login-grid .full-width { grid-column: 1; }
            .exam-header { flex-direction: column; align-items: stretch; }
            .question-card { padding: 20px; }
            .nav-buttons button { flex: 1; text-align: center; padding: 12px 16px; }
        }
    </style>
</head>

            </div>

    </div>

    </div>

</div>

// ============================================================
//  4.  TIMER
// ============================================================
function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeRemaining--;
        if (timeRemaining <= 0) {
            timeRemaining = 0;
            clearInterval(timerInterval);
            alert('⏰ Time is up! Your exam will be submitted automatically.');
            submitExam();
            return;
        }
        updateTimerDisplay();
    }, 1000);
}

function updateTimerDisplay() {
    const h = Math.floor(timeRemaining / 3600);
    const m = Math.floor((timeRemaining % 3600) / 60);
    const s = timeRemaining % 60;
    timerDisplay.textContent = `⏳ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ============================================================
//  5.  RENDER QUESTION
// ============================================================
function renderQuestion(index) {
    if (!QUESTIONS[index]) return;
    const q = QUESTIONS[index];
    const selected = answers[index];

    while (q.opts.length < 4) {
        q.opts.push('Option ' + (q.opts.length + 1));
    }

    let html = `<div class="question-card">`;
    html += `<div class="q-text">${index+1}. ${q.q}</div>`;
    html += `<div class="options">`;
    const labels = ['A', 'B', 'C', 'D'];
    q.opts.slice(0, 4).forEach((opt, i) => {
        const checked = (selected === i) ? 'checked' : '';
        const cls = (selected === i) ? 'selected' : '';
        html += `
            <label class="${cls}">
                <input type="radio" name="q${index}" value="${i}" ${checked} />
                <span><strong>${labels[i]}.</strong> ${opt}</span>
            </label>
        `;
    });
    html += `</div></div>`;
    questionContainer.innerHTML = html;

    document.querySelectorAll(`input[name="q${index}"]`).forEach((radio) => {
        radio.addEventListener('change', function() {
            const val = parseInt(this.value, 10);
            answers[index] = val;
            const labels = document.querySelectorAll('.options label');
            labels.forEach((l, idx) => {
                l.classList.toggle('selected', idx === val);
            });
            updateProgress();
        });
    });

    questionCounter.textContent = `Question ${index+1} of ${totalQ}`;
    updateProgress();
    updateNavButtons();
}

function updateProgress() {
    const answered = answers.filter(a => a !== null).length;
    const pct = Math.round((answered / totalQ) * 100);
    progressFill.style.width = pct + '%';
}

function updateNavButtons() {
    prevBtn.disabled = (currentIndex === 0);
    nextBtn.disabled = (currentIndex === totalQ - 1);
    if (currentIndex === totalQ - 1) {
        nextBtn.textContent = '📌 Finish Review';
    } else {
        nextBtn.textContent = 'Next ▶';
    }
}

// ============================================================
//  6.  NAVIGATION
// ============================================================
prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion(currentIndex);
    }
});

nextBtn.addEventListener('click', () => {
    if (currentIndex < totalQ - 1) {
        currentIndex++;
        renderQuestion(currentIndex);
    }
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
    }
});

// ============================================================
//  7.  SUBMIT EXAM WITH FORMSPREE
// ============================================================
submitBtn.addEventListener('click', function() {
    if (isSubmitting) return;
    
    const answered = answers.filter(a => a !== null).length;
    const unanswered = totalQ - answered;
    
    if (answered === 0) {
        alert('⚠️ You haven\'t answered any questions yet! Please answer at least one question before submitting.');
        return;
    }
    
    if (unanswered > 50) {
        if (!confirm(`⚠️ You have ${unanswered} unanswered questions out of ${totalQ}. Are you sure you want to submit?`)) {
            return;
        }
    } else {
        if (!confirm(`📊 Exam Summary\n\nAnswered: ${answered}/${totalQ}\nUnanswered: ${unanswered}\n\nDo you want to submit your exam?`)) {
            return;
        }
    }
    
    submitExam();
});

function submitExam() {
    if (isSubmitting) return;
    isSubmitting = true;
    
    if (timerInterval) clearInterval(timerInterval);
    
    const answered = answers.filter(a => a !== null).length;
    const unanswered = totalQ - answered;
    
    // Prepare answers summary
    let answersText = '';
    for (let i = 0; i < answers.length; i++) {
        const ans = answers[i];
        const q = QUESTIONS[i];
        answersText += `Q${i+1}: ${ans !== null ? q.opts[ans] : 'Not Answered'}\n`;
    }
    
    // Prepare exam data
    const examData = {
        student: studentData,
        answers: answers.map((ans, idx) => {
            return {
                question: idx + 1,
                answer: ans !== null ? QUESTIONS[idx].opts[ans] : 'Not Answered',
                selected: ans
            };
        }),
        summary: {
            total: totalQ,
            answered: answered,
            unanswered: unanswered,
            percentage: Math.round((answered / totalQ) * 100)
        },
        timestamp: new Date().toISOString(),
        antiCheat: {
            allIdentical: answers.every(a => a === answers[0]) && answers[0] !== null,
            largeUnansweredBlock: (answers.indexOf(null) !== -1 && answers.lastIndexOf(null) - answers.indexOf(null) > 20)
        }
    };
    
    console.log('📤 Exam Submitted:', examData);
    
    // Show submitting status
    submissionStatus.className = 'loading';
    submissionStatus.textContent = '📧 Submitting your exam... Please wait.';
    submissionStatus.style.display = 'block';
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ Submitting...';
    
    // Send to Formspree
    const formspreeUrl = 'https://formspree.io/f/xkjnobqq';
    
    // Prepare form data
    const formData = new FormData();
    formData.append('email', 'samp32471@gmail.com');
    formData.append('studentName', studentData.fullName);
    formData.append('admission', studentData.admission);
    formData.append('course', studentData.course);
    formData.append('studentEmail', studentData.email);
    formData.append('totalQuestions', totalQ);
    formData.append('answered', answered);
    formData.append('unanswered', unanswered);
    formData.append('percentage', Math.round((answered / totalQ) * 100) + '%');
    formData.append('timestamp', new Date().toLocaleString());
    formData.append('answersSummary', answersText);
    formData.append('fullData', JSON.stringify(examData, null, 2));
    
    // Send to Formspree
    fetch(formspreeUrl, {
        method: 'POST',
        body: formData,
        headers: {
            'Accept': 'application/json'
        }
    })
    .then(response => {
        if (response.ok) {
            submissionStatus.className = 'success';
            submissionStatus.textContent = '✅ Exam submitted successfully! Results have been sent to your instructor.';
            
            // Download JSON backup
            downloadBackup(examData);
            
            // Disable all inputs
            document.querySelectorAll('input, button').forEach(el => el.disabled = true);
            submitBtn.disabled = true;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            timerDisplay.textContent = '✅ Submitted';
            
            alert(`✅ Exam submitted successfully!\n\nStudent: ${studentData.fullName}\nCourse: ${studentData.course}\nAnswered: ${answered}/${totalQ}\nUnanswered: ${unanswered}\n\n📧 Results have been sent to your instructor.`);
            
        } else {
            throw new Error('Formspree submission failed');
        }
    })
    .catch(error => {
        console.error('Submission error:', error);
        submissionStatus.className = 'error';
        submissionStatus.textContent = '⚠️ There was an error submitting your exam. Please try again or contact your instructor.';
        submitBtn.disabled = false;
        submitBtn.textContent = '📤 Try Again';
        isSubmitting = false;
        
        // Offer alternative: download backup
        if (confirm('⚠️ Could not send results to server. Would you like to download your results as a backup file?')) {
            downloadBackup(examData);
            alert('📁 Your results have been downloaded as a JSON file. Please send this file to your instructor.');
        }
    });
}

function downloadBackup(examData) {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(examData, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `exam_results_${studentData.admission}_${new Date().toISOString().slice(0,10)}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

console.log('🔒 Anti-cheat: random order, keyboard disabled, timestamps.');
console.log('📧 Results will be sent to samp32471@gmail.com via Formspree.');
console.log('✅ Formspree endpoint: https://formspree.io/f/xkjnobqq');
</script>
